<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
        <nav><a href="/">Back to Groups</a></nav>
    </header>
    <main>
        <h2>Pending Groups</h2>
        <ul>
            {{range .PendingGroups}}
            <li>
                {{if .ImageURL}}
                <img src="{{.ImageURL}}" alt="{{.Title}}" class="group-image">
                {{else}}
                <div class="group-image group-image--placeholder" role="img" aria-label="{{.Title}}"><span>{{.Title}}</span></div>
                {{end}}
                <p>{{.Title}} - {{.DateTime.Format "2006-01-02 15:04"}}</p>
                <form method="POST" action="/admin/approve/{{.ID}}">
                    {{ .csrfField }}
                    <label>Tags (comma-separated): <input type="text" name="tags"></label>
                    <button type="submit">Approve</button>
                </form>
            </li>
            {{end}}
        </ul>
    </main>
</body>
</html>
