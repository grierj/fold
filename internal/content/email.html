<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<style>:root { color-scheme: light; supported-color-schemes: light; }</style>
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border-radius:8px;">
<tr><td style="padding:20px 24px 0 24px;font-family:Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;color:#52525b;font-weight:bold;">{{.Church}}</td></tr>
<tr><td style="padding:8px 24px 24px 24px;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#18181b;">{{.Body}}</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
<tr><td style="padding:16px 24px;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#52525b;">
{{.Footer}}{{if .SettingsURL}} To stop them or change which emails you get, <a href="{{.SettingsURL}}" style="color:#52525b;text-decoration:underline;">visit your email settings</a>.{{end}}
{{range .Address}}<br>{{.}}{{end}}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
