# Opt-in override for a local scripts/compose-smoke.sh run. Not used in CI.
#
# The shipped network is 172.30.0.0/24, which is also the default
# FOLD_TRUSTED_PROXIES. A second stack on this machine cannot take that
# subnet. The script adds this file when --local-subnet or FOLD_SMOKE_SUBNET
# is set, or when 172.30.0.0/24 is already in use by another Docker network.
# Caddy stays off, so this run does not exercise the proxy CIDR; the script
# still checks that the shipped subnet contains that default.
networks:
  default:
    ipam:
      config: !override
        - subnet: 10.216.30.0/24
