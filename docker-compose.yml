services:
  db:
    image: postgres:16-alpine
    # No host ports. Publishing 5432 would bypass ufw (Docker writes iptables).
    # smoke.sh rejects a public bind. The app reaches Postgres on this network.
    restart: unless-stopped
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: fold
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    # No host ports. Caddy is the only published service (80 and 443).
    # 8080 on 0.0.0.0 would bypass ufw. Loopback is the only bind smoke allows.
    restart: unless-stopped
    environment:
      APP_ENV: prod
      PORT: 8080
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATABASE_URL: postgres://church:${DB_PASSWORD}@db:5432/fold?sslmode=disable
      COOKIE_SECURE: "true" # TLS is terminated at Caddy; browsers still see https
      SITE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      FOLD_SMTP_URL: ${FOLD_SMTP_URL:-}
      FOLD_SMTP_ALLOW_INSECURE: ${FOLD_SMTP_ALLOW_INSECURE:-false}
      FOLD_EMAIL_FROM: ${FOLD_EMAIL_FROM:-}
      FOLD_EMAIL_PROVIDER: ${FOLD_EMAIL_PROVIDER:-}
      FOLD_POSTMARK_SERVER_TOKEN: ${FOLD_POSTMARK_SERVER_TOKEN:-}
      FOLD_POSTMARK_TRANSACTIONAL_STREAM: ${FOLD_POSTMARK_TRANSACTIONAL_STREAM:-}
      FOLD_POSTMARK_BROADCAST_STREAM: ${FOLD_POSTMARK_BROADCAST_STREAM:-}
      FOLD_WORKERS: ${FOLD_WORKERS:-2}
      FOLD_JOB_POLL: ${FOLD_JOB_POLL:-1s}
      # Only Caddy, on the fixed subnet below, may set X-Forwarded-For (C17).
      FOLD_TRUSTED_PROXIES: ${FOLD_TRUSTED_PROXIES:-172.30.0.0/24}
    volumes:
      # Avatars and cover photos. A named volume survives `up --build`;
      # the image's anonymous VOLUME /data does not.
      - uploads:/data
    healthcheck:
      test: ["CMD", "/fold", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      DOMAIN: ${DOMAIN}

# One network with a fixed subnet, so the app can trust exactly its proxy.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  uploads:
  caddydata:
  caddyconfig:
