services:
  db:
    image: postgres:16-alpine
    # No host ports. Publishing 5432 would bypass ufw (Docker writes iptables).
    # smoke.sh rejects a public bind. The app reaches Postgres on this network.
    restart: unless-stopped
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: fold
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # A published, pinned release. Set FOLD_VERSION in .env to an exact version
    # (for example 0.5.0), never a floating tag. Developers build from source
    # with docker-compose.build.yml (docker compose -f docker-compose.yml
    # -f docker-compose.build.yml up -d --build).
    image: ghcr.io/grierj/fold:${FOLD_VERSION:?Set FOLD_VERSION in .env}
    # No host ports. Caddy is the only published service (80 and 443).
    # 8080 on 0.0.0.0 would bypass ufw. Loopback is the only bind smoke allows.
    restart: unless-stopped
    environment:
      APP_ENV: prod
      PORT: 8080
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      FOLD_SETUP_TOKEN: ${FOLD_SETUP_TOKEN:-}
      DATABASE_URL: postgres://church:${DB_PASSWORD}@db:5432/fold?sslmode=disable
      COOKIE_SECURE: "true" # TLS is terminated at Caddy; browsers still see https
      SITE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      FOLD_SMTP_URL: ${FOLD_SMTP_URL:-}
      FOLD_SMTP_ALLOW_INSECURE: ${FOLD_SMTP_ALLOW_INSECURE:-false}
      FOLD_EMAIL_FROM: ${FOLD_EMAIL_FROM:-}
      FOLD_EMAIL_PROVIDER: ${FOLD_EMAIL_PROVIDER:-}
      FOLD_POSTMARK_SERVER_TOKEN: ${FOLD_POSTMARK_SERVER_TOKEN:-}
      FOLD_POSTMARK_TRANSACTIONAL_STREAM: ${FOLD_POSTMARK_TRANSACTIONAL_STREAM:-}
      FOLD_POSTMARK_BROADCAST_STREAM: ${FOLD_POSTMARK_BROADCAST_STREAM:-}
      FOLD_POSTMARK_WEBHOOK_SECRET: ${FOLD_POSTMARK_WEBHOOK_SECRET:-}
      FOLD_WORKERS: ${FOLD_WORKERS:-2}
      FOLD_JOB_POLL: ${FOLD_JOB_POLL:-1s}
      # Only Caddy, on the fixed subnet below, may set X-Forwarded-For (C17).
      FOLD_TRUSTED_PROXIES: ${FOLD_TRUSTED_PROXIES:-172.30.0.0/24}
      # Where the app reads the backup service's two status files (read-only).
      FOLD_BACKUP_DIR: /backup-status
    volumes:
      # Avatars and cover photos. A named volume survives `up --build`;
      # the image's anonymous VOLUME /data does not.
      - uploads:/data
      # LAST_OK and status.json only. The app never mounts the archives.
      - backup-status:/backup-status:ro
    healthcheck:
      test: ["CMD", "/fold", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      DOMAIN: ${DOMAIN}

  backup:
    # Nightly and on-demand backups of the database and the uploads volume
    # (deploy/backup/README.md). FOLD_BACKUP_VERSION lets a deployment keep a
    # published backup image while the app is pinned to an older release that
    # has none; it defaults to the app's version.
    image: ghcr.io/grierj/fold-backup:${FOLD_BACKUP_VERSION:-${FOLD_VERSION}}
    # No host ports. The service only talks to the database.
    restart: unless-stopped
    # An explicit identity: the host keeps its own copies of older archives in a
    # root-only folder of the backups volume, which this user cannot open.
    # provision.sh refuses a resolved configuration that changes either line.
    user: "65532:65532"
    cap_drop:
      - ALL
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      FOLD_BACKUP_TZ: ${FOLD_BACKUP_TZ:-}
      FOLD_BACKUP_KEEP_DAYS: ${FOLD_BACKUP_KEEP_DAYS:-}
      # Optional offsite copies: all six or none. Only the public age
      # recipient is here; the private identity stays offline.
      FOLD_BACKUP_S3_BUCKET: ${FOLD_BACKUP_S3_BUCKET:-}
      FOLD_BACKUP_S3_ENDPOINT: ${FOLD_BACKUP_S3_ENDPOINT:-}
      FOLD_BACKUP_S3_REGION: ${FOLD_BACKUP_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      FOLD_BACKUP_AGE_RECIPIENT: ${FOLD_BACKUP_AGE_RECIPIENT:-}
      # Set by deploy/digitalocean/provision.sh (FOLD_BACKUP_COORD=<deploy
      # dir>) so a host restore and a backup never overlap. Unset, this is
      # empty and the service runs uncoordinated.
      FOLD_RECOVERY_DIR: ${FOLD_BACKUP_COORD:+/coord}
    volumes:
      # Read-only: a backup only reads the uploads.
      - uploads:/data:ro
      - backups:/backups
      - backup-status:/backup-status
      # The host's backup.lock and recovery.lock, read-only. With
      # FOLD_BACKUP_COORD unset this is an empty named volume.
      - ${FOLD_BACKUP_COORD:-backup-coord}:/coord:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup.sh", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

# One network with a fixed subnet, so the app can trust exactly its proxy.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  uploads:
  # Archives (root:65532, mode 1770). Only the backup service mounts it; the
  # host reads and keeps its own adopted/ copies in the same volume.
  backups:
  # LAST_OK and status.json: written by backup, read-only in the app.
  backup-status:
  # Placeholder for /coord when FOLD_BACKUP_COORD is unset.
  backup-coord:
  caddydata:
  caddyconfig:
