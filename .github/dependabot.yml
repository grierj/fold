# Weekly dependency updates (DEC-37, 10.6). Grier reviews and merges them;
# CI (govulncheck, npm audit, tests) runs on every one.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Minor and patch bumps come grouped; each major gets its own PR, so a
    # framework migration never holds up safe updates.
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Node LTS only: skip odd-numbered (non-LTS) releases.
    ignore:
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
