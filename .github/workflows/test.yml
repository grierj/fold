name: test

# Branch work runs CI through its pull request; push runs only on master
# (Grier, Oct 22, 2026).
on:
  push:
    branches: [master]
  pull_request:

# Least privilege: the jobs only read the repo (#95).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: church
          POSTGRES_PASSWORD: church
          POSTGRES_DB: fold
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U church"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://church:church@localhost:5432/fold?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make lint-sh lint-go
      # Known vulnerabilities in reachable Go code (DEC-37). Pinned version.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # Includes the schema drift check (migrations/migrations_test.go).
      - run: make test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build && npm run bundle-size
      # Runtime dependencies only; dev-only findings come through Dependabot.
      - working-directory: web
        run: npm audit --omit=dev --audit-level=high

  # Frontend tests (M0.4): Vitest, then Playwright (Chromium) against the
  # real binary on a fresh Postgres database (make e2e, web/e2e/server.sh).
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: church
          POSTGRES_PASSWORD: church
          POSTGRES_DB: fold
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U church"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://church:church@localhost:5432/fold?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm test
      # Unused files, exports and dependencies (knip, #79).
      - run: make lint-web
      # Token contrast (ENFORCEMENT.md B7): text 4.5:1, control edges 3:1.
      - working-directory: web
        run: npm run contrast
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - run: make e2e
      # Screenshots of the main pages at 390, 768 and 1280 px, kept with the
      # run so a styling PR's reviewer can compare them with master's.
      - name: Screenshots
        working-directory: web
        run: SCREENS_DIR="$PWD/screens" npx playwright test seed screens
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: web/screens/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  # DigitalOcean provisioner: shellcheck, a dry-run, and a second real run
  # inside Ubuntu 24.04 (systemd and Docker stubbed). No DigitalOcean API calls.
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make lint-sh
      - run: make provision-dry-run
