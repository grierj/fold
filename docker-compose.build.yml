# Developer override: build the app image from this checkout instead of
# pulling the published one (PLAN C10). Use it on top of the shipped file:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# FOLD_VERSION still has to be set in .env; any label works here (for example
# dev). It only names the local image. The build needs about 2 GB of memory;
# a 1 GB machine can run out. Pull the published image there instead.
services:
  app:
    build: .
